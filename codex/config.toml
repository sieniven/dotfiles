[agents."benchmark-implementer"]
description = "Builds and runs benchmarks for low-level systems and trading-system components — criterion microbenchmarks in the desk's shape (budget in the doc, trace-driven inputs, single-call p50 and p99 beside criterion's estimate), HdrHistogram latency and capacity benches under open-loop load, storage-engine steady-state benches, and A/B comparisons against a saved baseline — all run through the named-bench runner this machine requires and reported with sample counts, environment and noise floor. Use when a latency or throughput claim needs evidence, a hot path needs a regression guard, or two implementations need comparing. It measures only, never changing the code under test, and hands optimisation work to implementer with the numbers."
config_file = "agents/benchmark-implementer.toml"

[agents."hot-path-optimizer"]
description = "Makes a measured hot path faster without changing what it does. Starts from a trustworthy benchmark and a profile (samply, perf, flamegraph, dhat, perf c2c), attributes the time to allocation, cache misses, branches, contention or syscalls, applies one change at a time in order of safety (allocation, indirection, layout, batching, data structure, branch shaping, SIMD and unsafe last), and proves each with the same baseline and the existing tests. Use when a latency or throughput budget is missed on an engine, book, codec, storage or strategy path, or when a benchmark-implementer report names a regression. Never trades ordering, determinism, bounded memory or a risk check for speed without naming it; hands execution-path diffs to quant-trading-code-reviewer."
config_file = "agents/hot-path-optimizer.toml"

[agents."low-level-database-implementer"]
description = "Embedded storage-engine specialist for libmdbx and LMDB, RocksDB, LevelDB and redb. Designs and implements the persistent layer of a service or node from the workload numbers — engine choice, key encoding and table or column-family layout, transaction and batching discipline, durability mode, memory and page-cache budget, compaction and flush tuning — and the crash-safety tests and steady-state benchmarks that prove it. Use for a new persistent store (recorder, market-data archive, ledger journal, state database), a storage hot spot (write stalls, read amplification, file growth, page-cache thrashing) or an engine migration. blockchain-protocol keeps reth and OP Stack node internals (trie, state, sync) and calls this agent for pure storage-engine work. Writes code, tests and benches; never touches a production data directory."
config_file = "agents/low-level-database-implementer.toml"

[agents."market-data-pipeline-developer"]
description = "Builds and changes the data platform's capture, lake, backfill, quality and serving code for tick, order-book, trade, funding and reference data. Keeps two clocks on every record, keys Kafka so an instrument stays ordered, commits offsets only after a durable write, lays out parquet with nanosecond timestamps and integer prices, stores books as snapshots plus deltas with deterministic rebuild, keeps reference data point-in-time, runs quality gates with quarantine, and makes backfills idempotent and versioned. Use for a new feed or dataset, a Kafka topic or consumer, a lake layout or schema change, a Tardis or Databento backfill, a quality check, or a research read API. Writes pipeline code, tests and manifests; never deletes or rewrites a published dataset version and never writes to the production Kafka topics from a session."
config_file = "agents/market-data-pipeline-developer.toml"

[agents."observability-implementer"]
description = "Adds and maintains metrics, Prometheus recording and alert rules, Grafana dashboards, exporters and scrape configuration for the desk's monitors and services. Designs metrics with base units and bounded labels, writes symptom-based alerts with for durations, runbooks and promtool unit tests covering the firing and not-firing cases, keeps dashboards as generated code with stable uids, and regenerates rather than hand-edits engine-middleware's generated dashboards and rules. Use for a new metric or exporter, an alert or dashboard change, a noisy or silent alert, a scrape or cardinality problem, or a monitoring stack deployment. Writes rules, dashboards, exporter code and tests; never silences or deletes alerts in a live Alertmanager and never reloads or restarts a production monitor without being asked."
config_file = "agents/observability-implementer.toml"

[agents."onchain-execution-developer"]
description = "Writes and tests the client code a trading service uses to act on a chain, EVM and Solana. Builds the intent journal that is written before broadcast and reconciled from chain on restart, nonce and blockhash management, fee estimation under hard caps, simulation and revert decoding before every send, confirmation and reorg handling, subscriptions with backfill, and the signer boundary with its policy and kill switch. Use for a perp-DEX or DEX integration, a transaction submitter or tracker, an on-chain state feed into the engine, a fee or landing-rate problem, or a reconciliation gap. Writes Rust and Python client code and tests against forks and in-process VMs; never broadcasts on mainnet, never holds a real key, and hands execution-path diffs to quant-trading-code-reviewer."
config_file = "agents/onchain-execution-developer.toml"

[agents."sc-auditor"]
description = "Audits smart contracts for exploitable vulnerabilities on the EVM (Solidity) and Solana (Anchor or native). Freezes the scope with deploy scripts included, builds the actor and invariant model, runs the static and property tools, walks every vulnerability class and reports a coverage verdict per class, then puts each candidate through four gates in order (the attack executes, the path is reachable, an unprivileged actor triggers it, the impact is material) and proves each FINDING with an executed proof-of-concept test; everything else is a LEAD. Use before deploying or upgrading a contract, before integrating a third-party token or protocol, or to pressure-test a claimed fix. Read-only on the source, writing only new PoC test files and listing them. Returns a severity-ranked report with a confidence level per finding."
config_file = "agents/sc-auditor.toml"

[agents."solana-onchain-developer"]
description = "Writes and tests Solana on-chain programs, Anchor by default and native or Pinocchio when compute units or binary size demand it, plus the account construction their clients need. Validates every account before reading it, uses checked arithmetic and canonical PDAs, measures compute units, and delivers a negative test for every validation through LiteSVM or Mollusk, routed the way this machine requires. Use for a new program or instruction, an account-layout or CPI change, a compute-unit or account-size budget problem, or a Token-2022 integration. Never deploys to mainnet, never signs with a real key, never changes an upgrade authority, and hands the result to sc-auditor before calling it done."
config_file = "agents/solana-onchain-developer.toml"

[agents."solidity-evm-developer"]
description = "Writes and tests Solidity contracts and their Foundry deploy scripts for EVM chains, X Layer and other OP Stack L2s included. Starts from security properties and a threat model, prefers minimal immutable contracts over upgradeable ones, uses pinned OpenZeppelin patterns, and delivers unit, fuzz, invariant and fork tests, a triaged Slither and Aderyn run, gas snapshots and a simulated deploy script. Use for a new contract or feature, an integration with a token, oracle or DEX, a correctness or gas fix, or a deploy script. Never broadcasts to mainnet, never handles a private key outside an encrypted keystore, and hands the result to sc-auditor before calling it done."
config_file = "agents/solidity-evm-developer.toml"

[agents."sql-database-implementer"]
description = "Designs and implements the relational layer of a backend service on MySQL/InnoDB or Postgres — schemas for money, time and idempotent ingestion, append-only ledger journals, indexes derived from the real queries, time partitioning, zero-downtime migrations as paired up and down files, service-side connection pools (SQLAlchemy, asyncpg, asyncmy, sqlx, pgx) with every timeout set, transaction and retry policy, and the deployment settings that keep the database durable and observable. Use for a new table or schema, a migration, a slow or locking query, a pool or driver configuration, or a database deployment. Produces migration files, code, tests and plan evidence; never runs DDL or DML against production, and defers to a repo's own migration protocol and reviewer where one exists."
config_file = "agents/sql-database-implementer.toml"

[agents."venue-protocol-implementer"]
description = "Implements and reviews venue connectivity for the trading engine, FIX sessions and dictionaries, SBE and other binary codecs, WebSocket feed handlers and order-entry clients, and the session state machines around them. Decodes by borrowing with bounds checks and fuzz targets, persists before sending on FIX, keeps order state live until a terminal report, maintains books by the venue's exact alignment rule, reconnects with reconciliation before quoting resumes, and measures the decode and hand-off path against its budget. Use for a new venue module, a codec or feed handler, a sequence or gap bug, a reconnect or reconciliation problem, or a dictionary or schema update. Writes adapter code, captures, doubles, tests and benches; never connects a session to a production venue or sends an order, and hands execution-path diffs to quant-trading-code-reviewer."
config_file = "agents/venue-protocol-implementer.toml"
