name: claude-harness

on:
  pull_request:
    paths:
      - "claude/**"
      - ".github/workflows/claude-harness.yml"
  push:
    branches: [main]
    paths:
      - "claude/**"
      - ".github/workflows/claude-harness.yml"

jobs:
  check:
    # Keep the check names as before the os key was added to the matrix.
    name: check (${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # 3.9 is macOS's system python3, which the hooks run under. It is
          # end-of-life, and setup-python publishes it only up to Ubuntu
          # 24.04, so that leg stays pinned while ubuntu-latest moves on.
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install lint dependencies
        run: python -m pip install --quiet pyyaml
      - name: Lint harness
        run: python claude/scripts/lint_harness.py
      - name: Hook tests
        run: python -m unittest discover -s claude/hooks/tests -v
